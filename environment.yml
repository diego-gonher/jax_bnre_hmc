# Conda convenience environment (not the source of truth).
# Canonical dependencies live in pyproject.toml. After activation, the editable
# install should match `pip install -e .` for the documented end-to-end workflow.
#
# From the repository root:
#   conda env create -f environment.yml
#   conda activate jax_bnre
#
# Requires conda to run `pip install` from this directory so `-e .` resolves.

name: jax_bnre
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - "-e ."
