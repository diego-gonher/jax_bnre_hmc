# Path to the training run directory (contains train.yaml and checkpoints/)
run_dir: outputs/amber501_skewers/2026-03-17_18-26-21

output_dir: null

hydra:
  run:
    dir: ${run_dir}/hmc_results

data:
  dataset_file: /Users/diegogonzalez/Documents/Research/ENIGMA/BNRE-HMC/jax_bnre_hmc/datasets/amber501/tau_skewers_z5.00_with_masks_miniset.hdf5  # set via CLI or override; HDF5 with params, tau_skewers

num_chains: 4
num_warmup: 4000
