# Path to the training run directory (contains config.yaml and checkpoints/)
run_dir: outputs/amber501_skewers/2026-03-15_17-02-48

output_dir: null

data:
  dataset_file: null  # set via CLI or override; HDF5 with params, tau_skewers

num_chains: 4
num_warmup: 4000
num_samples: 4000

n_observations: 100
n_plots: 25
