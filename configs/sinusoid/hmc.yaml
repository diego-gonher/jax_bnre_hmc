# Path to the training run directory (contains train.yaml and checkpoints/)
run_dir: outputs/sinusoid/2026-03-29_17-53-57

# Where to write HMC outputs (null => run_dir/hmc_results). Hydra run dir is set to the same
# so that job logs (e.g. hmc.log) end up next to corner plots, TARP, and posterior HDF5.
output_dir: null

hydra:
  run:
    dir: ${run_dir}/hmc_results

data:
  dataset_file: /Users/diegogonzalez/Documents/Research/ENIGMA/BNRE-HMC/jax_bnre_hmc/datasets/sinusoid/sinusoid_noisy_no_masks.h5  # set via CLI or override; HDF5 with theta, y_obs

num_chains: 4
num_warmup: 4000
num_samples: 4000

n_observations: 500
n_plots: 25
seed: 2401

# Prior in scaled space [-1,1]^4
prior:
  type: box
  low: [-1.0, -1.0, -1.0, -1.0]
  high: [1.0, 1.0, 1.0, 1.0]
