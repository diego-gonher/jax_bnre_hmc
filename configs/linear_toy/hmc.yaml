# Path to the training run directory (contains config.yaml and checkpoints/)
# Override via CLI: run_dir=outputs/linear_toy/YYYY-MM-DD_HH-MM-SS
run_dir: outputs/linear_toy/2026-01-29_16-18-01_gamma10000.0

# Where to write HMC outputs (null => run_dir/hmc_results/)
output_dir: null

# Observations: null = simulate (linear toy)
data:
  dataset_file: null
  n_points: 10
  sigma: 0.1

# Simulator prior bounds (for generating/simulating observations)
simulator_prior:
  m_low: 0.0
  m_high: 1.0
  b_low: 0.0
  b_high: 1.0

# HMC / NUTS
num_chains: 4
num_warmup: 1000
num_samples: 1000

# Inference
n_observations: 500
n_plots: 10
seed: 42

# Prior in parameter space (must match training; box [0,1]^2 for linear toy)
prior:
  type: box
  low: [0.0, 0.0]
  high: [1.0, 1.0]

corner_labels: ["m", "b"]
