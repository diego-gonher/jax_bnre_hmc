# Path to the training run directory (contains config.yaml and checkpoints/)
run_dir: outputs/amber501_p1d/2026-03-15_13-11-30

output_dir: null

data:
  dataset_file: null  # set via CLI or override; HDF5 with params, subset_of_mock_datasets

num_chains: 4
num_warmup: 4000
num_samples: 4000

n_observations: 100
n_plots: 25
seed: 2401

# Prior built from convex hull of scaled params in dataset (same dataset_file)
prior:
  type: convex_hull

corner_labels: ["z_mid", "Delta_z", "A_z", "T_0", "<F>"]

# Data loading splits (must match script logic)
data_split_test_fraction: 0.2
data_split_validation_fraction: 0.2
